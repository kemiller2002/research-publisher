name: Golden Visual Engineering corpus

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  golden-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Research Publisher
        uses: actions/checkout@v6

      - name: Check out Visual Engineering corpus
        uses: actions/checkout@v6
        with:
          repository: kemiller2002/visual-engineering
          path: golden/visual-engineering

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run lifecycle:build
      - name: Validate the real corpus
        run: node ./scripts/golden-visual-engineering.mjs ./golden/visual-engineering

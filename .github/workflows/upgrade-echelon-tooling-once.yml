name: Upgrade Echelon tooling once

on:
  push:
    branches:
      - "work/gh-7-semantic-projection-vnext-impl"
    paths:
      - ".github/workflows/upgrade-echelon-tooling-once.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "work/gh-7-semantic-projection-vnext-impl"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Pin ROS 3.1.0
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "ros.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.rosVersion = "3.1.0";
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Converge ROS 3.1.0 installation
        run: |
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros init --dry-run --json
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros init
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros verify
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros validate

      - name: Upgrade SDE to 1.3.0
        run: |
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde status
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde upgrade --dry-run
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde upgrade
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde verify --strict

      - name: Record exact released payloads
        run: |
          git rm .github/workflows/upgrade-echelon-tooling-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade ROS 3.1.0 and SDE 1.3.0 from released packages"
            git push origin HEAD:"work/gh-7-semantic-projection-vnext-impl"
          fi

name: Lifecycle CLI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Proves the packed npm artifact works on every supported operating system,
  # rather than proving only that the source tree compiles.
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run lifecycle:test
      - run: npm run lifecycle:build

      # Packs the package and runs every documented command against the archive.
      - run: npm run smoke:package

  # Confirms every published runtime identifier still builds.
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run lifecycle:build:all
      - run: npm pack --dry-run

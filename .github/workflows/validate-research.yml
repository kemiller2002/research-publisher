name: Validate Research

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci

      # The lifecycle CLI is F#; stage the host binary before anything uses it.
      - run: npm run lifecycle:build
      - run: npm run lifecycle:test

      # This repository is also a consumer of the capability it publishes.
      - run: node ./bin/research-publisher.js verify
      - run: node ./bin/research-publisher.js doctor

      - run: npm run research:inventory
      - run: npm run research:validate
      - run: npm run research:test
      - run: npm run research:build
      - run: npm run research:build:fixture


  echelon-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "chore/echelon-capability-upgrade-2026-09-21"
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Upgrade SDE to source 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/state-directed-engineering.git "$RUNNER_TEMP/sde-source"
          pushd "$RUNNER_TEMP/sde-source/distribution"
          npm run build:payload
          popd
          if [[ -d .sde || -f .echelon/sde.json ]]; then cmd=upgrade; else cmd=init; fi
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- "$cmd"
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify --strict

      - name: Upgrade ROS to source 3.1.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/repository-operating-system.git "$RUNNER_TEMP/ros-source"
          if [[ -f .echelon/ros.json || -f ros.json || -f ros ]]; then cmd=upgrade; else cmd=init; fi
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- "$cmd"
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- verify --strict

      - name: Install or upgrade Visual Engineering 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .echelon/visual-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/visual-engineering@1.0.0 "$cmd"
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict

      - name: Install or upgrade Communication Engineering source 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/communication-engineering.git "$RUNNER_TEMP/communication-engineering-source"
          if [[ -f .echelon/communication-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" "$cmd"
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" verify --strict

      - name: Install or upgrade Limen 0.6.1
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f limen.config.json ]]; then
            cat > limen.config.json <<'JSON'
          {
            "configurationVersion": 1,
            "boundary": {
              "engine": [],
              "kernel": []
            }
          }
          JSON
          fi
          if [[ -f .echelon/limen.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 "$cmd"
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 verify --strict

      - name: Commit upgraded repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate-research.yml
          git rm --ignore-unmatch .github/workflows/echelon-capability-upgrade.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes were required."
            exit 0
          fi
          git commit -m "chore: upgrade Echelon engineering capabilities"
          git push origin HEAD:"chore/echelon-capability-upgrade-2026-09-21"

name: Validate Research

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci

      # The lifecycle CLI is F#; stage the host binary before anything uses it.
      - run: npm run lifecycle:build
      - run: npm run lifecycle:test

      # This repository is also a consumer of the capability it publishes.
      - run: node ./bin/research-publisher.js verify
      - run: node ./bin/research-publisher.js doctor

      - run: npm run research:inventory
      - run: npm run research:validate
      - run: npm run research:test
      - run: npm run research:build
      - run: npm run research:build:fixture


  tooling-upgrade:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/gh-7-semantic-projection-vnext-impl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Pin ROS 3.1.0 before convergence
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("ros.json", "utf8"));
          config.rosVersion = "3.1.0";
          fs.writeFileSync("ros.json", JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Converge released ROS 3.1.0 package
        run: |
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros init --dry-run --json
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros init
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros verify
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.0 ros validate

      - name: Upgrade from released SDE 1.3.0 package
        run: |
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde upgrade --dry-run
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde upgrade
          npx --yes --package=@echelon-foundry/sde@1.3.0 sde verify

      - name: Commit exact package output and remove temporary automation
        run: |
          git show origin/main:.github/workflows/validate-research.yml > .github/workflows/validate-research.yml
          rm -f .github/workflows/upgrade-echelon-tooling-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade ROS 3.1.0 and SDE 1.3.0 from released packages"
            git push origin HEAD:"work/gh-7-semantic-projection-vnext-impl"
          fi

name: Validate Research

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci

      # The lifecycle CLI is F#; stage the host binary before anything uses it.
      - run: npm run lifecycle:build
      - run: npm run lifecycle:test

      # This repository is also a consumer of the capability it publishes.
      - run: node ./bin/research-publisher.js verify
      - run: node ./bin/research-publisher.js doctor

      - run: npm run research:inventory
      - run: npm run research:validate
      - run: npm run research:test
      - run: npm run research:build
      - run: npm run research:build:fixture


  golden-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Research Publisher
        uses: actions/checkout@v6

      - name: Check out Visual Engineering corpus
        uses: actions/checkout@v6
        with:
          repository: kemiller2002/visual-engineering
          path: golden/visual-engineering

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run lifecycle:build
      - name: Validate the real Visual Engineering corpus
        run: node ./scripts/golden-visual-engineering.mjs ./golden/visual-engineering

name: Publish npm Package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test package
        run: npm test

      - name: Build research site
        run: npm run research:build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Select the next npm version
        id: version
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          local_version="$(node --print "require('./package.json').version")"
          published_version="$(npm view "$package_name" version 2>/dev/null || true)"
          next_version="$(node --input-type=module -e '
            const [localVersion, publishedVersion] = process.argv.slice(1);
            const parts = (version) => version.split("-")[0].split(".").map(Number);
            const compare = (left, right) => {
              const a = parts(left);
              const b = parts(right);
              return a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            };
            if (!publishedVersion || compare(localVersion, publishedVersion) > 0) {
              console.log(localVersion);
            } else {
              const [major, minor, patch] = parts(publishedVersion);
              console.log(`${major}.${minor}.${patch + 1}`);
            }
          ' "$local_version" "$published_version")"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          if [[ "$next_version" != "$local_version" ]]; then
            npm version "$next_version" --no-git-tag-version
          fi

      - name: Publish package
        run: npm publish

      - name: Report published version
        run: echo "Published @echelon-foundry/research-publisher@${{ steps.version.outputs.version }}"
